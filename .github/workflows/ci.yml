name: ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install fastapi uvicorn pydantic openai numpy pytest httpx
      - name: Build the manual index
        run: python -m app.rag.index
      - name: Unit tests
        run: pytest -q
      - name: Retrieval eval
        run: python -m evals.run_rag_eval
      - name: Guardrail screen (offline)
        run: python -m evals.run_redteam --guards-only
